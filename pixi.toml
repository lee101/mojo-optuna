[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-optuna"
platforms = ["linux-64"]
version = "0.2.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"
bench-search = "python bench/bench_search.py"
mopt = "python -m mojo_optuna.search.cli"

[activation.env]
PYTHONPATH = "python"

[dependencies]
max = "==26.7.0.dev2026092605"
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
pytest = "*"
numpy = "*"
optuna = ">=4.9,<5"
scipy = "*"
cmaes = "*"
